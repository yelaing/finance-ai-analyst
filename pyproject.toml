# 代码质量工具配置。ruff 同时负责 lint 与 format，不引入 black ——
# ruff format 的目标就是与 black 输出兼容，两个格式化器并存只会互相改写。

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["data", ".venv", "venv"]

[tool.ruff.lint]
# 不选 E501：折行交给 ruff format 处理，两者同时开启会互相打架
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
files = ["backend"]
ignore_missing_imports = true
warn_redundant_casts = true
# pydantic 模型（含 langchain 的 ChatOpenAI）靠 alias 校验，没有插件时
# mypy 看不到 max_tokens 这类字段名，会误报 call-arg
plugins = ["pydantic.mypy"]

# 存量代码：暂不强制逐函数标注，后续切片逐步加严
[[tool.mypy.overrides]]
module = ["backend.pipeline.*", "backend.store.*", "backend.schemas.*", "backend.main", "backend.api.routes"]
disallow_untyped_defs = false

# 新增的基础设施代码：强制完整类型标注
[[tool.mypy.overrides]]
module = ["backend.core.*", "backend.api.middleware", "backend.api.errors"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = ["integration: 跨多个模块协作的集成测试"]

[tool.coverage.run]
source = ["backend"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
# 覆盖率门槛只写在这一处，CI 不重复声明 --cov-fail-under
fail_under = 80
show_missing = true
# 仅排除运行时客观不可达的两类行，不用 pragma 刷数字
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
